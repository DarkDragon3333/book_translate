# Локальный перевод технических книг EN → RU (EPUB и PDF).
# Запуск:   docker compose up -d
# EPUB:     docker compose run --rm translate     <книга.epub> [области глоссария]
# PDF→EPUB: docker compose run --rm pdf-epub      <книга.pdf>  [области глоссария]   (Docling + EPUB-конвейер)
# PDF→PDF:  docker compose run --rm translate-pdf <книга.pdf>  [области глоссария]   (pdf2zh)
# PDF GUI:  docker compose --profile pdf up -d   → http://127.0.0.1:7860
# Интерфейс: docker compose --profile gui up -d  → http://127.0.0.1:8090 (EPUB и PDF → EPUB, очередь, прогресс)
# Гибрид:   docker compose run --rm -e MODEL=hybrid -e HYBRID_SHARE=40 translate <книга.epub> [области]
#
# Все образы закреплены по digest: обновления не ломают проверенную систему.

name: book_translate

x-ollama-image: &ollama_image ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551   # 0.34.4

services:
  ollama:
    image: *ollama_image
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # один запрос за раз — меньше VRAM
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_CONTEXT_LENGTH: "2048"   # у translategemma-gpu свой num_ctx в Modelfile
      # Движок llama-server по умолчанию копит кэш промптов в оперативной памяти до 8 ГБ (--cache-ram 8192).
      # При переводе книги каждый абзац — новый промпт, кэш бесполезен, а лимит WSL — 8 ГБ на всё:
      # 29.09 перевод книги упал с «Cannot allocate memory». 0 — кэш выключен.
      LLAMA_ARG_CACHE_RAM: "0"
    volumes:
      - ollama-data:/root/.ollama     # модели переживают пересоздание контейнера
      - ./models:/models:ro           # дообученные GGUF (training/, Kaggle)
      - ./config/ollama:/config/ollama:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Один раз при запуске: скачивает базовые модели (если их нет) и (пере)создаёт translategemma-gpu и rosetta-ru;
  # rosetta12-ru (режим «качество») — только если её база уже скачана.
  ollama-init:
    image: *ollama_image
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./config/ollama/Modelfile:/config/Modelfile:ro
      - ./config/ollama:/config/ollama:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama show translategemma:4b >/dev/null 2>&1 || ollama pull translategemma:4b
        ollama create translategemma-gpu -f /config/Modelfile
        echo "Модель translategemma-gpu готова"
        ROSETTA=hf.co/yanolja/YanoljaNEXT-Rosetta-4B-2511-GGUF:Q5_K_M
        ollama show $$ROSETTA >/dev/null 2>&1 || ollama pull $$ROSETTA
        ollama create rosetta-ru -f /config/ollama/Modelfile.rosetta
        echo "Модель rosetta-ru готова (модель по умолчанию для EPUB)"
        # Режим «качество»: Rosetta-12B (7,1 ГБ, часть слоёв в ОЗУ, в ~6 раз медленнее). Сама не скачивается —
        # иначе первый запуск ждал бы 7 ГБ, а интерфейс ждёт ollama-init. Установка — команда ниже, затем up -d ollama-init.
        ROSETTA12=hf.co/yanolja/YanoljaNEXT-Rosetta-12B-2510-GGUF:IQ4_XS
        if ollama show $$ROSETTA12 >/dev/null 2>&1; then
          ollama create rosetta12-ru -f /config/ollama/Modelfile.rosetta12
          echo "Модель rosetta12-ru готова (режим «качество»)"
        else
          echo "Режим «качество» не установлен: docker compose exec ollama ollama pull $$ROSETTA12 && docker compose up -d ollama-init"
        fi
    restart: "no"

  # Конвейер перевода. Не запускается через up — только через run.
  translate:
    image: ghcr.io/yihong0618/bilingual_book_maker@sha256:7f9cf02dae3d3bc4144723fcba759cf002649546af1e21cd4879fa88694ba2e6
    profiles: ["cli"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "/scripts/translate.sh"]
    working_dir: /app
    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL: rosetta-ru               # быстрый режим; качество: -e MODEL=rosetta12-ru (в ~6 раз медленнее); гибрид: -e MODEL=hybrid; запасная: -e MODEL=translategemma-gpu
      REMEDY_URL: http://remedy:8091  # гибрид: сервис оценки абзацев
      BBM_API_KEY: ollama             # Ollama ключ не проверяет, но bbm требует его для не-localhost адреса
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./source:/source:ro           # оригиналы — только чтение
      - ./books:/books                # рабочие файлы и результаты
      - ./scripts:/scripts:ro
      - ./config:/config:ro

  # PDF → EPUB → перевод: Docling размечает страницы, docling_rebuild собирает английский EPUB,
  # дальше обычный EPUB-конвейер (Rosetta). Только через run. Результат — books/<книга>_epub/.
  pdf-epub:
    build: ./docker/epub
    image: book_translate/pdf-epub:1
    profiles: ["cli"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      docling:
        condition: service_started
    entrypoint: ["sh", "/scripts/translate.sh"]
    working_dir: /app
    environment:
      PIPELINE: docling
      DOCLING_URL: http://docling:5001
      OLLAMA_URL: http://ollama:11434
      MODEL: rosetta-ru
      REMEDY_URL: http://remedy:8091
      BBM_API_KEY: ollama
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./source:/source:ro
      - ./books:/books
      - ./scripts:/scripts:ro
      - ./config:/config:ro

  # Веб-интерфейс: очередь книг, выбор глоссариев/страниц/глав, прогресс, результаты, абзацы EN/RU.
  # Запускает тот же scripts/translate.sh, что и `run pdf-epub`/`run translate`. PDF → PDF (pdf2zh) — только командой.
  gui:
    image: book_translate/pdf-epub:1
    build: ./docker/epub
    container_name: book-gui
    profiles: ["gui"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    # Docling (разметка PDF) интерфейс не запускает: его включает и выключает значок в трее (app/BookTranslate.ps1)
    entrypoint: ["python", "/scripts/gui/server.py"]
    working_dir: /app
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      DOCLING_URL: http://docling:5001
      OLLAMA_URL: http://ollama:11434
      MODEL: rosetta-ru
      REMEDY_URL: http://remedy:8091
      BBM_API_KEY: ollama
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./source:/source:ro
      - ./books:/books
      - ./scripts:/scripts:ro
      - ./config:/config:ro
    stop_grace_period: 30s        # перевод останавливается аккуратно и продолжается кнопкой «Повторить»
    deploy:                       # только для nvidia-smi: строка состояния показывает загрузку GPU
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Гибридный режим: оценка абзацев моделью ReMedy-9B (llama-server из образа llama.cpp). Модель загружается
  # в видеопамять только на время оценки книги (Ollama на это время выгружает свои) и выгружается сама.
  # Файлы модели — models/remedy9b (готовит experiments/qe/remedy_local/prepare.py, см. README «Гибридный режим»);
  # без них сервис работает, но гибрид недоступен.
  remedy:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda@sha256:3d4d8201cc9d1e88227aab9a66ba696335ffa22ef94eb3e47377b2736c0bbec7
    container_name: remedy
    entrypoint: ["python3", "/scripts/remedy_server.py"]
    environment:
      REMEDY_DIR: /models/remedy9b
      REMEDY_GGUF: remedy9b-Q5_K_M.gguf   # рабочий квант (13.10: точность как у Q6_K, скорость как у Q4_K_M)
      REMEDY_NGL: "17"                    # слоёв на GPU из 41 (~3,9 ГБ видеопамяти)
      REMEDY_THREADS: "6"
      REMEDY_IDLE: "120"                  # выгрузить модель после 2 минут простоя
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./models:/models:ro
      - ./scripts:/scripts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Docling (docling-serve, CPU): разметка PDF по HTTP для pdf-epub. Модели уже в образе; грузятся в память
  # при первом запросе и выгружаются после разметки книги. Запускается сам вместе с pdf-epub;
  # остановить после перевода: docker compose stop docling
  docling:
    image: quay.io/docling-project/docling-serve-cpu@sha256:953dec7821c17e2ff67f9bc6f5b924e84371fcf9b87683fe310ed9bfa074cec8   # Docling 2.130.0
    container_name: docling
    profiles: ["cli", "docling"]  # не стартует вместе с интерфейсом: значок в трее включает его только для PDF
    environment:
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"     # одна книга за раз — меньше памяти
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_SERVE_ENABLE_UI: "false"
    restart: "no"

  # Конвейер перевода PDF: pdf2zh CLI + проверка и ремонт страниц. Только через run.
  translate-pdf:
    build: ./docker/pdf
    image: book_translate/pdf-pipeline:1
    profiles: ["cli"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "/scripts/translate.sh"]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./source:/source:ro
      - ./books:/books
      - ./scripts:/scripts:ro
      - ./config:/config:ro
      - pdf2zh-cache:/root/.cache     # общий с GUI: кэш переводов и модели разметки

  # PDF: веб-интерфейс pdf2zh (PDFMathTranslate-next).
  pdf2zh:
    image: awwaawwa/pdfmathtranslate-next@sha256:c737d5342c9220a56026733f3a42182581bb4d8e5052b133e3326babffea109a
    container_name: pdf2zh
    profiles: ["pdf"]
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./config/pdf2zh/config.v3.toml:/root/.config/pdf2zh/config.v3.toml:ro
      - ./config/glossary:/config/glossary:ro
      - pdf2zh-cache:/root/.cache     # кэш переводов и модели разметки BabelDOC
    restart: unless-stopped


volumes:
  ollama-data:
  pdf2zh-cache:
